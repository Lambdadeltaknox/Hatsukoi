<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReprOwOductor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="local-player-page">
<!--Menu de opciones-->
    <button id="MenuBtn" class="menu-btn" title="Opciones" aria-label="Opciones">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <button
    id="PlaylistBtn"
    class="playlist-btn"
    title="Lista de reproducción"
    aria-label="Lista de reproducción"
    >
    ☷
    </button>


      <aside id="OptionsMenu" class="options-menu">
        <h2>Opciones</h2>
        <!--Agregar canciones/carpetas-->
        <div class="options-menu-section">

            <p>Media</p>
        
            <label for="FileInput" class="options-menu-item">
                Agregar canciones
            </label>

            <label for="FolderInput" class="options-menu-item">
                Agregar carpeta
            </label>
        </div>
        <!--Agregar/Quitar fondo-->
        <div class="options-menu-section">
            <p>Fondo</p>
            <label for="BgInput" class="options-menu-item">
                Cambiar fondo
            </label>

            <button type="button" id="MenuResetBgBtn" class="options-menu-item">
                Eliminar fondo
            </button>
        </div>
        <!--Opciones de tema-->
        <div class="options-menu-section">
            <p>Tema</p>
            <div id="ThemeGrid" class="theme-grid">
                <button type="button" class="theme-swatch" data-theme="dark" style="--swatch-bg:#050505; --swatch-primary:#e5e5e5;">
                    <span class="theme-swatch-dot"></span>Oscuro
                </button>
                <button type="button" class="theme-swatch" data-theme="gray" style="--swatch-bg:#1c1c1e; --swatch-primary:#9ca3af;">
                    <span class="theme-swatch-dot"></span>Gris
                </button>
                <button type="button" class="theme-swatch" data-theme="ocean" style="--swatch-bg:#0c1821; --swatch-primary:#06b6d4;">
                    <span class="theme-swatch-dot"></span>Oceano
                </button>
                <button type="button" class="theme-swatch" data-theme="purple" style="--swatch-bg:#0f0514; --swatch-primary:#a855f7;">
                    <span class="theme-swatch-dot"></span>Purpura
                </button>
                <button type="button" class="theme-swatch" data-theme="red" style="--swatch-bg:#1a0a0a; --swatch-primary:#ef4444;">
                    <span class="theme-swatch-dot"></span>Rojo
                </button>
                <button type="button" class="theme-swatch" data-theme="pink" style="--swatch-bg:#170a12; --swatch-primary:#ec4899;">
                    <span class="theme-swatch-dot"></span>Kawaii
                </button>
                <button type="button" class="theme-swatch" data-theme="amber" style="--swatch-bg:#140d05; --swatch-primary:#f59e0b;">
                    <span class="theme-swatch-dot"></span>Ambar
                </button>
                <button type="button" class="theme-swatch" data-theme="xbox" style="--swatch-bg:#000000; --swatch-primary:#3aff5e;">
                    <span class="theme-swatch-dot"></span>Xbox
                </button>
                <button type="button" class="theme-swatch" data-theme="bosque" style="--swatch-bg:#081510; --swatch-primary:#35c98a;">
                    <span class="theme-swatch-dot"></span>Bosque
                </button>
                <button type="button" class="theme-swatch" data-theme="sakura" style="--swatch-bg:#160d14; --swatch-primary:#ff78b7;">
                    <span class="theme-swatch-dot"></span>Sakura
                </button>
                <button type="button" class="theme-swatch" data-theme="artico" style="--swatch-bg:#091318; --swatch-primary:#72d9ff;">
                    <span class="theme-swatch-dot"></span>Ártico
                </button>
                <button type="button" class="theme-swatch" data-theme="uva" style="--swatch-bg:#120b18; --swatch-primary:#b66dff;">
                    <span class="theme-swatch-dot"></span>Uva
                </button>
                <button type="button" class="theme-swatch" data-theme="cosmos" style="--swatch-bg:#080914; --swatch-primary:#777cff;">
                    <span class="theme-swatch-dot"></span>Cosmos
                </button>
                <button type="button" class="theme-swatch" data-theme="menta" style="--swatch-bg:#081512; --swatch-primary:#50e3c2;">
                    <span class="theme-swatch-dot"></span>Menta
                </button>
                <button type="button" class="theme-swatch" data-theme="cafe" style="--swatch-bg:#15100d; --swatch-primary:#d99a5b;">
                    <span class="theme-swatch-dot"></span>Café
                </button>
                <button type="button" class="theme-swatch" data-theme="atardecer" style="--swatch-bg:#180d0a; --swatch-primary:#ff7657;">
                    <span class="theme-swatch-dot"></span>Atardecer
                </button>
                <button type="button" class="theme-swatch" data-theme="esmeralda" style="--swatch-bg:#06130f; --swatch-primary:#20d68a;">
                    <span class="theme-swatch-dot"></span>Esmeralda
                </button>
                <button type="button" class="theme-swatch" data-theme="cian" style="--swatch-bg:#071318; --swatch-primary:#00d9ff;">
                    <span class="theme-swatch-dot"></span>Cian
                </button>
            </div>
        </div>

      </aside>
<!--Playlist Menu-->
    <aside id="PlaylistMenu" class="playlist-menu">
        <div class="playlist-menu-header">
            <h2>Lista de reproducción</h2>
            <button type="button" id="ClearPlaylistBtn" class="playlist-clear-btn" title="Vaciar lista" aria-label="Vaciar lista">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
        </div>

        <div class="playlist-toolbar">
            <div class="playlist-search-container">
                <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="PlaylistSearchInput" placeholder="Buscar en la lista..." aria-label="Buscar en la lista de reproducción" autocomplete="off" />
                <button type="button" id="PlaylistSearchClear" title="Limpiar búsqueda" aria-label="Limpiar búsqueda">&times;</button>
            </div>

            <select id="PlaylistSortSelect" class="playlist-sort-select" aria-label="Ordenar lista de reproducción">
                <option value="none">Ordenar…</option>
                <option value="name">Nombre (A-Z)</option>
                <option value="artist">Artista (A-Z)</option>
            </select>
        </div>

        <p id="PlaylistStats" class="playlist-stats"></p>

        <div class="playlist-scroll">
            <div id="PlaylistList" class="playlist-list">
                <p class="playlist-empty">No hay canciones en la fila</p>
            </div>
        </div>
    </aside>

    <!-- Modal de confirmación para vaciar la playlist -->
    <div id="ClearPlaylistModal" class="clear-playlist-modal" aria-hidden="true">
        <div class="clear-playlist-modal-box" role="dialog" aria-modal="true" aria-labelledby="ClearPlaylistModalTitle">
            <p id="ClearPlaylistModalTitle">¿Seguro que quieres vaciar la lista onichan~?</p>
            <div class="clear-playlist-modal-actions">
                <button type="button" id="CancelClearPlaylist" class="btn-secondary">Cancelar</button>
                <button type="button" id="ConfirmClearPlaylist" class="btn-secondary danger">Vaciar</button>
            </div>
        </div>
    </div>

<!--Codigo al azar-->
    <main class="local-player-hero" id="DropZone">
        <div class="drop-overlay" id="DropOverlay">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v14m0-14 5 5m-5-5-5 5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <p>Suelta tus canciones aquí</p>
       </div>

        <div class="local-player-artwork" id="ArtworkCard">
            <div id="visualizer-container">
                <canvas id="visualizer-canvas"></canvas>
            </div>
            <img class="local-player-cover-img" id="CoverArt" alt="Carátula del track actual" />
            <svg class="local-player-cover-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 18V5l12-2v13" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="6" cy="18" r="3" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="18" cy="16" r="3" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>

        <div class="local-player-meta">
            <h1 id="Title">No hay canciones</h1>
            <p id="Name">Elige uno o varios archivos de tu equipo para empezar</p>
        </div>

        <div class="local-player-actions">
           
            <input type="file" accept="audio/*" id="FileInput" multiple hidden />

            <input
            type="file"
            id="FolderInput"
            webkitdirectory
            multiple
            hidden
            />

            <input type="file" accept="image/*" id="BgInput" hidden />

        </div>

        <p class="local-player-hint" id="PlaylistHint">
            
        </p>
    </main>

    <audio id="Song"></audio>

    <footer class="now-playing-bar">
        <canvas id="mini-visualizer-canvas"></canvas>

        <div class="track-info">
            <img class="cover" id="BarCover" alt="Carátula actual" />
            <div class="details">
                <div class="title" id="BarTitle"></div>
                <div class="artist" id="BarArtist"></div>
            </div>
        </div>

        <div class="player-controls">
            <div class="buttons">
                <button id="shuffle-btn" title="Aleatorio" aria-label="Activar orden aleatorio" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button id="BackBtn" title="Anterior" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                </button>
                <button id="PlayPauseBtn" class="play-pause-btn" title="Reproducir" aria-label="Reproducir">
                    <svg class="icon-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M7 4.7c0-1.13 1.23-1.83 2.2-1.24l9.7 5.8a1.44 1.44 0 0 1 0 2.48l-9.7 5.8c-.97.59-2.2-.1-2.2-1.24z"/></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none"><rect x="6" y="4" width="4.5" height="16" rx="1.8"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.8"/></svg>
                </button>
                <button id="NextBtn" title="Siguiente" aria-label="Siguiente">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                </button>
                <button id="repeat-btn" title="Repetir" aria-label="Cambiar modo de repetición">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
            <div class="progress-container">
                <span id="CurrentTime">0:00</span>
                <div id="ProgressBar" class="progress-bar">
                    <div id="ProgressFill" class="progress-fill"></div>
                </div>
                <span id="TotalDuration">0:00</span>
            </div>
        </div>

        <div class="volume-controls">
            <div class="volume-slider-row">
                <button id="VolumeBtn" title="Silenciar" aria-label="Silenciar">
                    <svg class="icon-volume-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.3 5.5a9 9 0 0 1 0 13"/></svg>
                    <svg class="icon-volume-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/></svg>
                </button>
                <div id="VolumeBar" class="volume-bar">
                    <div id="VolumeFill" class="volume-fill"></div>
                </div>
            </div>
        </div>
    </footer>

    <div id="ToastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="jsmediatags.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
